name: CI

# Pull request validation for main, plus quick feedback on feature branches.
# Uses the plain `pull_request` trigger (never `pull_request_target`), and
# has no access to signing secrets, so PRs from forks can't reach them.
# Nothing is published from this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Flutter version the test baseline is verified with. Bump deliberately.
  FLUTTER_VERSION: '3.47.9'
  APP_ID: com.rananjaya.RCBFlow

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  version-check:
    name: Version check
    # Only meaningful for PRs into main. Skipped jobs count as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate semantic version
        run: bash tool/ci/check_version.sh --mode pr

  release-build-check:
    name: Release build check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # No android/key.properties here, so Gradle falls back to the debug key.
      # This only proves the release build compiles; the APK isn't uploaded.
      - name: Build release APK (unsigned validation build)
        run: flutter build apk --release

      - name: Verify package and permissions
        run: bash tool/ci/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk "$APP_ID"
