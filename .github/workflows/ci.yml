name: CI

# Static analysis and unit/widget tests on every push and pull request.
# Needs no secrets or signing material, and builds no APKs. The release
# workflows (build.yml, test.yml) are separate and unchanged.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Version the test baseline was verified with; bump deliberately.
          flutter-version: '3.47.9'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test
