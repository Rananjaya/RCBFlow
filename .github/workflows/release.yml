name: Release

# Publishes a signed GitHub Release for every push to main. With branch
# protection on, the only pushes to main are merged pull requests.
#
# Order matters: analysis, tests, version check, signed build and APK
# verification must all pass before anything is tagged or published. A failure
# at any step publishes nothing.

on:
  push:
    branches: [main]

permissions:
  contents: read

# No `concurrency:` group on purpose. GitHub keeps only one pending run per
# group and cancels older pending ones, which would silently skip versions.
# Instead, the first step waits for every earlier run of this workflow to
# finish (FIFO by run number), so each merged version gets its own release, in
# merge order. Tags are pushed without --force, so two runs can never
# overwrite each other's tag even in the worst case.

env:
  FLUTTER_VERSION: '3.47.9'
  APP_ID: com.rananjaya.RCBFlow
  # SHA-256 of the permanent RCBFlow release certificate (public, not a
  # secret). Any APK signed with another key, including the debug key, fails.
  RELEASE_CERT_SHA256: '5fb96f9450a5316648cdc4134883e1c2b6d3f008ca32ba2235cff343d3bb44a2'

jobs:
  release:
    name: Build and publish release
    # Never release from forks or other branches.
    if: github.repository == 'Rananjaya/RCBFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Includes time spent waiting for earlier release runs.
    timeout-minutes: 120
    permissions:
      contents: write # create the tag and the GitHub Release
      actions: read   # list earlier runs of this workflow (merge-order queue)
    steps:
      - name: Wait for earlier release runs (merge order)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run numbers increase in the order pushes reach main. Wait until no
          # earlier run of this workflow is still queued or running.
          deadline=$((SECONDS + 75 * 60))
          while true; do
            if earlier="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=100" \
                --jq "[.workflow_runs[] | select(.status != \"completed\" and .run_number < $GITHUB_RUN_NUMBER) | .run_number] | map(tostring) | join(\" \")")"; then
              if [ -z "$earlier" ]; then
                echo "No earlier release runs pending; continuing as run #$GITHUB_RUN_NUMBER."
                break
              fi
              echo "Waiting for earlier release run(s): #${earlier// / #}"
            else
              echo "Could not list workflow runs; retrying."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Release queue timeout::Earlier release runs still pending after 75 minutes; re-run this job when they finish."
              exit 1
            fi
            sleep 30
          done

      - name: Checkout merged commit with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate semantic version
        id: version
        run: bash tool/ci/check_version.sh --mode release

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::Release $TAG already exists; bump the version in pubspec.yaml."
            exit 1
          fi
          echo "No release for $TAG yet."

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Configure these repository secrets:$missing (see RELEASE.md)"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/rcbflow-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [ -s "$keystore" ] || { echo "::error::Decoded keystore is empty"; exit 1; }
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore"
          } > android/key.properties
          echo "Signing configured (keystore in runner temp, key.properties generated)."

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK (package, permissions, signing certificate)
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.build }}
        run: |
          bash tool/ci/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk \
            "$APP_ID" "$RELEASE_CERT_SHA256"

      - name: Prepare release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          apk="RCBFlow-$VERSION-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256" && cat "$apk.sha256")
          echo "apk=dist/$apk" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Without --force, the push fails if the tag already exists on GitHub.
          git push origin "$GITHUB_SHA:refs/tags/$TAG"
          echo "Created tag $TAG at $GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA_FILE: ${{ steps.assets.outputs.sha }}
        run: |
          gh release create "$TAG" "$APK" "$SHA_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RCBFlow $VERSION" \
            --notes "RCBFlow $VERSION (build $BUILD). Signed release APK and SHA-256 checksum attached." \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rcbflow-release.jks" android/key.properties
          echo "Signing files removed."
